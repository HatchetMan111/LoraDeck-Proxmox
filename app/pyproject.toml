[project]
name = "loradeck"
version = "1.0.0"
description = "Companion and monitoring UI for Awaro LoRaWAN gateways"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loradeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
